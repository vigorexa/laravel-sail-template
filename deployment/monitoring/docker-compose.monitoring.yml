---

services:

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - application-prometheus:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      start_period: 40s
      retries: 3
      timeout: 10s
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    configs:
      - source: otel-collector-config
        target: /etc/otelcol-contrib/config.yml
    networks:
      - monitoring
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yml
    configs:
      - source: loki-config
        target: /etc/loki/loki-config.yml
    volumes:
      - application-loki:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 30s
      start_period: 40s
      retries: 3
      timeout: 10s
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.swarm.service.name,com.docker.stack.namespace,com.docker.swarm.task.name
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring
    privileged: true
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  alloy:
    image: grafana/alloy:v1.9.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - application-alloy:/var/lib/alloy/data
    networks:
      - monitoring
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  grafana:
    image: grafana/grafana:11.6.0
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: "http://${GRAFANA_HOST:-grafana.localhost}"
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
    volumes:
      - application-grafana:/var/lib/grafana
    networks:
      - monitoring
      - app_traefik_reverse-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      start_period: 40s
      retries: 3
      timeout: 10s
    logging:
      options:
        max-size: "200k"
        max-file: "10"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.swarm.network=app_traefik_reverse-proxy
        - traefik.http.services.grafana.loadbalancer.server.port=3000
        - traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-grafana.localhost}`)
        - traefik.http.routers.grafana.service=grafana


networks:
  monitoring:
    name: app_monitoring_monitoring
    driver: overlay
    attachable: true
  app_traefik_reverse-proxy:
    external: true


volumes:
  application-grafana:
    driver: local
  application-loki:
    driver: local
  application-prometheus:
    driver: local
  application-alloy:
    driver: local


configs:
  otel-collector-config:
    file: ./configs/otel-collector-config.yml
  prometheus-config:
    file: ./configs/prometheus-config.yml
  loki-config:
    file: ./configs/loki-config.yml
  alloy-config:
    file: ./configs/alloy.config.alloy
  grafana-datasources:
    file: ./configs/grafana-datasources.yml
