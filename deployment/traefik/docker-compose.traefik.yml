---

services:

  traefik:
    image: traefik:v3.6.1
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.proxyProtocol.insecure=true
      - --entrypoints.web.forwardedHeaders.insecure=true
      - --entrypoints.websecure.address=:443
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.watch=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=app_traefik_reverse-proxy
      - --accesslog=true
      - --api.dashboard=true
      - --api.basePath=/traefik
      - --metrics.prometheus=true
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - reverse-proxy
      - app_monitoring_monitoring
    ports:
      - "${APP_PORT:-80}:80"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik-dashboard.service=api@internal
        - traefik.http.services.traefik-dashboard.loadbalancer.server.port=9999
        - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST:-traefik.localhost}`) && PathPrefix(`/traefik`)
    logging:
      options:
        max-size: "200k"
        max-file: "10"


networks:
  reverse-proxy:
    name: app_traefik_reverse-proxy
    driver: overlay
    attachable: true
  app_monitoring_monitoring:
    external: true
