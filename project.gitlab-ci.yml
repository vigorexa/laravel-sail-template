stages:
  - lint
  - build
  - test
  - deploy

variables:
  PINT_CONFIG: https://raw.githubusercontent.com/vigorexa/pint-config/refs/heads/main/pint.json
  APP_NAME: app #CHANGEME

  DEVELOP_ENVIRONMENT_BRANCH: master
  DEVELOP_SSH_CONNECTION: deploy@192.168.0.0 #CHANGEME. И размести в Settings > CI/CD > Variables. Потом удали эту строчку
  DEVELOP_SSH_CONNECTION_PORT: 22
  DEVELOP_SSH_DEPLOYMENT_KEY: "" #CHANGEME. И размести в Settings > CI/CD > Variables. Потом удали эту строчку
  DEVELOP_SWARM_STACKS_DIRECTORY: swarm-stacks #CHANGEME
  DEVELOP_ENVIRONMENT_URL: https://example.com #CHANGEME
  DEVELOP_ENV_FILE: "" #CHANGEME. И размести в Settings > CI/CD > Variables с типом File. Потом удали эту строчку

  PROD_ENVIRONMENT_BRANCH: production
  PROD_SSH_CONNECTION: deploy@192.168.0.1 #CHANGEME. И размести в Settings > CI/CD > Variables. Потом удали эту строчку
  PROD_SSH_CONNECTION_PORT: 22
  PROD_SSH_DEPLOYMENT_KEY: "" #CHANGEME. И размести в Settings > CI/CD > Variables. Потом удали эту строчку
  PROD_SWARM_STACKS_DIRECTORY: swarm-stacks #CHANGEME
  PROD_ENVIRONMENT_URL: https://example.com #CHANGEME
  PROD_ENV_FILE: "" #CHANGEME. И размести в Settings > CI/CD > Variables с типом File. Потом удали эту строчку



# LINT

lint.pint:
  stage: lint
  image: vigorexa/laravel-sail-core:php85-alpine-slim-latest
  before_script:
    - export PINT_VERSION=`composer show --locked 'laravel/pint' | grep 'versions' | grep -o -E '\*\ .+' | cut -d' ' -f2 | cut -d',' -f1;`
    - composer global require laravel/pint $PINT_VERSION
  script:
    - /root/.composer/vendor/bin/pint --config $PINT_CONFIG --test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $DEVELOP_ENVIRONMENT_BRANCH
      allow_failure: true



# BUILD

.build-base:
  stage: build
  image: docker:cli
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    DOCKER_TARGET: development
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker buildx create --name ci-builder --driver docker-container --use || docker buildx use ci-builder
    - docker buildx inspect --bootstrap
  script:
    - >
      docker buildx build
      --target $DOCKER_TARGET
      --cache-from type=registry,ref=$DOCKER_CACHE_REF
      --cache-to type=registry,ref=$DOCKER_CACHE_REF,mode=max
      --file docker/laravel/Dockerfile
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      --push
      .

build.merge-request:
  extends: [ .build-base ]
  variables:
    DOCKER_CACHE_REF: $CI_REGISTRY_IMAGE:cache-develop
    DOCKER_TARGET: development
  script:
    - >
      docker buildx build
      --target $DOCKER_TARGET
      --cache-from type=registry,ref=$DOCKER_CACHE_REF
      --file docker/laravel/Dockerfile
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      --push
      .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build.develop:
  extends: [ .build-base ]
  variables:
    DOCKER_CACHE_REF: $CI_REGISTRY_IMAGE:cache-develop
    DOCKER_TARGET: development
  rules:
    - if: $CI_COMMIT_BRANCH == $DEVELOP_ENVIRONMENT_BRANCH

build.production:
  extends: [ .build-base ]
  variables:
    DOCKER_CACHE_REF: $CI_REGISTRY_IMAGE:cache-production
    DOCKER_TARGET: production
  rules:
    - if: $CI_COMMIT_BRANCH == $PROD_ENVIRONMENT_BRANCH



# TEST

.test-base:
  stage: test
  image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  script:
    - cd /var/www/html
    - php artisan test --compact

test.phpunit:
  extends: [ .test-base ]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $DEVELOP_ENVIRONMENT_BRANCH



# DEPLOY

.deploy:
  stage: deploy
  extends: [ .deployment:setup ]
  image: docker:26.1.3
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    LARAVEL_STACK_NAME: "${APP_NAME}_laravel"
  before_script:
    - sed -i 's#https\?://dl-cdn.alpinelinux.org#https://mirror.yandex.ru/mirrors#g' /etc/apk/repositories
    - apk add --no-cache openssh-client bash rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_DEPLOYMENT_KEY" | tr -d '\r' > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - |
      if [ -f /.dockerenv ]; then
        printf 'Host *\n\tStrictHostKeyChecking no\n\n' > ~/.ssh/config
      fi
  script:
    - bash ./deployment/sh-process-env.sh --fill-missing ./deployment/laravel/.env.example "$DEPLOYMENT_ENV_FILE" > ./deployment/laravel/.env
    - bash ./deployment/sh-process-compose-file.sh ./deployment/laravel/docker-compose.laravel.yml > ./deployment/laravel/docker-compose.laravel.processed.yml
    - rsync -av --mkpath -e "ssh -i ~/.ssh/deploy_key -p $SSH_CONNECTION_PORT" deployment/laravel/docker-compose.laravel.processed.yml "$SSH_CONNECTION:$SWARM_STACKS_DIRECTORY/laravel/"
    - |
      ssh -i ~/.ssh/deploy_key -p "$SSH_CONNECTION_PORT" "$SSH_CONNECTION" "
        set -e
        echo '$CI_JOB_TOKEN' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' || exit 1
        docker stack deploy --with-registry-auth -d -c $SWARM_STACKS_DIRECTORY/laravel/docker-compose.laravel.processed.yml $LARAVEL_STACK_NAME
      "

