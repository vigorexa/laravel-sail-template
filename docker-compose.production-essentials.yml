# Laravel application services only (laravel, horizon, cron).
# Merge with docker-compose.production.yml for the full production stack.
# Usage: docker stack deploy -c docker-compose.production.yml -c docker-compose.production-essentials.yml ...

services:

    laravel:
        image: ${IMAGE}
        command: ["/usr/bin/php", "-d", "variables_order=EGPCS", "/var/www/html/artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=80"]
        env_file:
            - .env
        networks:
            - pgsql
            - redis
            - mailpit
        volumes:
            - "storage:/var/www/html/storage"
        logging:
            options:
                max-size: "200k"
                max-file: "10"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/up"]
            interval: 10s
            start_period: 30s
            retries: 5
            timeout: 30s
        deploy:
            replicas: 1
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first
            restart_policy:
                condition: on-failure
            resources:
                limits:
                    cpus: '1'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M

    horizon:
        image: ${IMAGE}
        command: ["/usr/bin/php", "/var/www/html/artisan", "horizon"]
        env_file:
            - .env
        networks:
            - pgsql
            - redis
            - mailpit
        volumes:
            - "storage:/var/www/html/storage"
        logging:
            options:
                max-size: "200k"
                max-file: "10"
        stop_grace_period: 60s
        healthcheck:
            test: ["CMD", "/usr/bin/php", "/var/www/html/artisan", "horizon:status"]
            interval: 10s
            start_period: 30s
            retries: 5
            timeout: 30s
        deploy:
            replicas: 1
            update_config:
                parallelism: 1
                delay: 10s
            restart_policy:
                condition: on-failure
            resources:
                limits:
                    cpus: '1'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M

    cron:
        image: ${IMAGE}
        command: ["/usr/sbin/crond", "-f"]
        env_file:
            - .env
        networks:
            - pgsql
            - redis
            - mailpit
        volumes:
            - "storage:/var/www/html/storage"
        logging:
            options:
                max-size: "200k"
                max-file: "10"
        deploy:
            replicas: 1
            update_config:
                parallelism: 1
                delay: 10s
            restart_policy:
                condition: on-failure
            resources:
                limits:
                    cpus: '0.5'
                    memory: 256M
                reservations:
                    cpus: '0.1'
                    memory: 128M

volumes:
    storage:
        driver: local
