services:

    laravel:
        build:
            context: .
            dockerfile: docker/laravel/Dockerfile
            target: development
        command: ["/usr/bin/php", "-d", "variables_order=EGPCS", "/var/www/html/artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=80", "--watch"]
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PHP_IDE_CONFIG: '${PHP_IDE_CONFIG:-serverName=Docker}'
        volumes:
            - '.:/var/www/html'
        networks:
            - application
        depends_on:
            pgsql:
                condition: service_started
            keydb:
                condition: service_started
            mailpit:
                condition: service_started
            rustfs:
                condition: service_healthy

    pgsql:
        image: 'postgres:17'
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'application-pgsql:/var/lib/postgresql/data'
        networks:
            - application

    keydb:
        image: 'eqalpha/keydb:latest'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'application-keydb:/data'
        networks:
            - application

    mailpit:
        image: 'axllent/mailpit:v1.19.3'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - application

    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:-rustfsadmin}'
            RUSTFS_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:-rustfsadmin}'
            RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
            RUSTFS_OBS_METRICS_EXPORT_ENABLED: 'false'
            RUSTFS_OBS_LOGS_EXPORT_ENABLED: 'false'
            RUSTFS_OBS_TRACES_EXPORT_ENABLED: 'false'
        volumes:
            - 'application-rustfs:/data'
        networks:
            - application
        healthcheck:
            test: ['CMD', 'sh', '-ec', 'curl -fsS http://127.0.0.1:9000/health && curl -fsS http://127.0.0.1:9001/rustfs/console/health']
            interval: 30s
            start_period: 40s
            retries: 3
            timeout: 10s


networks:
    application:
        driver: bridge


volumes:
    application-pgsql:
        driver: local
    application-keydb:
        driver: local
    application-rustfs:
        driver: local
