# Infrastructure stack for production/staging (pgsql, redis, mailpit).
# Merge with docker-compose.production-essentials.yml for Laravel app services.
# Usage: docker stack deploy -c docker-compose.production.yml -c docker-compose.production-essentials.yml ...

services:

    pgsql:
        image: 'postgres:17'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        networks:
            - pgsql
        volumes:
            - 'application-pgsql:/var/lib/postgresql/data'
        healthcheck:
            test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE}", "-U", "${DB_USERNAME}"]
            interval: 10s
            start_period: 30s
            retries: 3
            timeout: 5s
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure

    redis:
        image: 'redis:7.4-alpine'
        networks:
            - redis
        volumes:
            - 'application-redis:/data'
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            start_period: 30s
            retries: 3
            timeout: 5s
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure

    mailpit:
        image: axllent/mailpit:v1.19.3
        environment:
            TZ: ${TZ:-Europe/Moscow}
            MP_DATABASE: /data/mailpit.db
        networks:
            - mailpit
        volumes:
            - 'application-mailpit:/data'
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure

networks:
    pgsql:
        driver: overlay
    redis:
        driver: overlay
    mailpit:
        driver: overlay

volumes:
    application-pgsql:
        driver: local
    application-redis:
        driver: local
    application-mailpit:
        driver: local
